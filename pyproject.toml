readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash-ag-grid>=31.3.1",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "statsmodels>=0.14.4",
    "yfinance>=0.2.64",
]
